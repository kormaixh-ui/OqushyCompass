# UNTESTED TEMPLATE. Check each key against the current Codemagic docs
# (docs.codemagic.io, "Flutter" and "Publishing to App Store Connect").
workflows:
  ios-testflight:
    name: OqushyCompass iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.karima.oqushyCompass
    scripts:
      - name: Generate iOS and Android folders
        script: flutter create --org com.karima --project-name oqushy_compass --platforms=ios,android .
      - name: Get packages
        script: flutter pub get
      - name: Make app icons
        script: dart run flutter_launcher_icons
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
