workflows:
  check-build:
    name: Check build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate platform folders
        script: flutter create --org com.karimamurat --project-name oqushy_compass --platforms=ios,android .
      - name: Remove default test
        script: rm -f test/widget_test.dart
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze || true
      - name: Build for simulator (no signing needed)
        script: flutter build ios --simulator --debug
